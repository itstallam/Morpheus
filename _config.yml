title: "Modernist Cyber"
description: >-
  A clean, modernist grid layout with a cyber-neon edge —
  sharp type, sharp lines, dark background.

theme: jekyll-theme-modernist

show_downloads: true
google_analytics:
baseurl: "/Morpheus"
url: "https://github.com/itstallam"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links

nav_links:
  - title: Home
    url: /
  - title: Lab
    url: /lab/
  - title: Blog
    url: /blog/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
