# ═══════════════════════════════════════════════════
#  THEME: Slate Obsidian
#  Base: jekyll-theme-slate  (GitHub Pages whitelisted)
#  Vibe: Polished obsidian with hammered gold and crimson accents.
# ═══════════════════════════════════════════════════

# REQUIRED — must be a GitHub Pages supported theme
theme: jekyll-theme-slate

# Site metadata
title: "Morpheus"
description: "Boot to r00t"
show_downloads: false
baseurl: "/Morpheus"
url: ""

# Plugins supported by GitHub Pages safe mode
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Author info
author:
  name: itstallam
  url: https://github.com/itstallam

# IMPORTANT: To activate the dark skin, create this file in your repo:
#   assets/css/style.scss
# And paste the contents from slate_obsidian_style.scss
